# SearXNG settings for the final project's search service.
# Only the backend reaches it, over Railway's private network, so the
# limiter and public-instance features stay off. secret_key comes from
# the SEARXNG_SECRET environment variable.
#
# Engines: the POC (../POC_SEARXNG_RAILWAY.md) tested 11 engines from a
# Railway IP. Only these three answered with relevant results; the rest
# were blocked (CAPTCHA / access denied / too many requests), timed out,
# or returned off-topic pages (bing).
use_default_settings:
  engines:
    keep_only:
      - yahoo
      - yandex
      - duckduckgo

general:
  instance_name: "taller-research-search"

search:
  safe_search: 1
  autocomplete: ""
  default_lang: "en"
  formats:
    - json

server:
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

outgoing:
  request_timeout: 4.0
  max_request_timeout: 8.0

engines:
  - name: duckduckgo
    disabled: false
  - name: yandex
    disabled: false
  - name: yahoo
    disabled: false
